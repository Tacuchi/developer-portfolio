server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Una ruta que no existe responde 404 de verdad, con la página de error del sitio.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # El 404 nunca se guarda en caché. En un despliegue conviven dos versiones unos
    # segundos: si un proxy guarda el 404 de una hoja de estilos, el sitio queda sin estilos.
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Archivos con huella en el nombre y fuentes: su contenido no cambia nunca.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes sin huella (vista previa, icono): pueden cambiar entre versiones.
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# El dominio antiguo lleva a la misma ruta del dominio oficial.
server {
    listen 80;
    server_name portfolio.tacuchi.dev;
    return 301 https://tacuchi.dev$request_uri;
}
